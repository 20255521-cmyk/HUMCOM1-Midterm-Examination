<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAYSO MIDTERM PORTFOLIO - Media</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman', Times, serif;
    }

    body {
      background-color: #d6d6d6;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #22252A;
      color: #ffffff;
      padding: 15px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    nav {
      background-color: #22252A;
      padding: 8px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 1px;
      font-weight: bold;
    }

    nav a.active,
    nav a:hover {
      color: #f8f5f5;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 2px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 30px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 40px;
      max-width: 850px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(8, 8, 8, 0.2);
    }

    .card h1 {
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      color: #000000;
      margin-bottom: 15px;
    }
  .avatar-group {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin-bottom: 5px;
    }

    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #cbd2c8;
      border: 2px solid #a3ae9f;
    }

    .description {
      font-size: 0.85rem;
      color: #222121;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    figure {
      margin: 20px 0;
    }

    audio {
      width: 100%;
      max-width: 450px;
      margin: 10px 0;
    }

    figcaption {
      font-size: 0.85rem;
      color: #222121;
      margin-top: 8px;
    }

    .btn {
      display: inline-block;
      background-color: #151d11;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: background-color 0.2s ease;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: #282e27;
    }

    footer {
      background-color: #151d12;
      color: #c2c9bf;
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
    }

    @media (max-width: 600px) {
      nav ul {
        gap: 15px;
        flex-wrap: wrap;
      }

      nav a {
        font-size: 0.75rem;
      }

      main {
        padding: 25px 15px;
      }

      .card {
        padding: 30px 15px;
      }
    }
  </style>
</head>

<body>

        <li><a href="services.html">SERVICES</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </nav>
  </header>

      </div>

</body>
</html>
